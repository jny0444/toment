<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FOLIO — archived communities</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,640&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,420;0,7..72,650;1,7..72,420&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="grain" aria-hidden="true"></div>
    <header class="mast">
      <div class="mast-id">
        <p class="wordmark">Folio</p>
        <p class="accession">SNA · Unit 3</p>
      </div>
      <div class="mast-title">
        <p class="kicker">Web archives and community evolution</p>
        <h1>Toxicity in three archived communities</h1>
      </div>
      <div class="mast-metrics" id="metrics"></div>
    </header>

    <div class="workspace">
      <aside class="index" id="index"></aside>
      <main class="stage" id="stage"></main>
      <aside class="desk" id="desk"></aside>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
